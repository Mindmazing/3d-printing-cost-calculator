<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Costos de Impresion 3d</title>
  </head>
  <body>
    <header>
      <nav>
        <h2 id="logo"><span>Atlas</span>Tools</h2>
        <button id="calculator-settings-btn" aria-label="Configuarcion">
          <svg
            width="2rem"
            height="2rem"
            viewBox="-1 0 19 19"
            xmlns="http://www.w3.org/2000/svg"
            class="cf-icon-svg"
            fill="currentColor"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></g>
            <g id="SVGRepo_iconCarrier">
              <path
                d="M16.014 8.86v1.44a.587.587 0 0 1-.468.556l-1.182.204a.463.463 0 0 1-.114.006 5.902 5.902 0 0 1-.634 1.528.455.455 0 0 1 .078.084l.691.98a.586.586 0 0 1-.062.725l-1.02 1.02a.586.586 0 0 1-.724.061l-.98-.69a.444.444 0 0 1-.085-.078 5.908 5.908 0 0 1-1.544.637.502.502 0 0 1 0 .175l-.182 1.053a.667.667 0 0 1-.633.532h-1.31a.667.667 0 0 1-.633-.532l-.182-1.053a.495.495 0 0 1 0-.175 5.908 5.908 0 0 1-1.544-.637.444.444 0 0 1-.085.077l-.98.691a.586.586 0 0 1-.725-.062l-1.02-1.02a.586.586 0 0 1-.061-.723l.691-.98a.454.454 0 0 1 .077-.085 5.901 5.901 0 0 1-.633-1.528.466.466 0 0 1-.114-.006l-1.182-.204a.586.586 0 0 1-.468-.556V8.86a.586.586 0 0 1 .468-.556L2.636 8.1a.437.437 0 0 1 .114-.005 5.912 5.912 0 0 1 .633-1.528.466.466 0 0 1-.077-.085l-.691-.98a.587.587 0 0 1 .061-.724l1.02-1.02a.587.587 0 0 1 .725-.062l.98.691a.444.444 0 0 1 .085.078 5.903 5.903 0 0 1 1.528-.634.433.433 0 0 1 .005-.114l.204-1.182a.586.586 0 0 1 .556-.468h1.442a.586.586 0 0 1 .556.468l.204 1.182a.448.448 0 0 1 .005.114 5.908 5.908 0 0 1 1.528.634.444.444 0 0 1 .085-.078l.98-.691a.586.586 0 0 1 .724.062l1.02 1.02a.586.586 0 0 1 .062.724l-.691.98a.467.467 0 0 1-.078.085 5.902 5.902 0 0 1 .634 1.528.434.434 0 0 1 .114.005l1.182.204a.587.587 0 0 1 .468.556zm-4.955.72a2.559 2.559 0 1 0-2.56 2.56 2.559 2.559 0 0 0 2.56-2.56z"
              ></path>
            </g>
          </svg>
        </button>
      </nav>
    </header>
    <main>
      <div class="form-container">
        <h1>Calcula el costo de impresion</h1>
        <form id="cost-calculator-form" novalidate>
          <div class="form-row">
            <div class="form-input">
              <label for="filament-amount">Cantidad de Filamento (g)</label>
              <input
                type="number"
                name="filament-amount"
                id="filament-amount"
                placeholder="Cantidad de Filamento (g)"
                required
                min="1"
              />
              <div class="error-message"></div>
            </div>
            <div class="form-input">
              <label for="type-of-filament">Tipo de Filamento</label>
              <select name="type-of-filament" id="type-of-filament" required>
                <option disabled selected hidden value="">
                  Tipo de Filamento
                </option>
              </select>
              <div class="error-message"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-input">
              <label for="time-amount-hours">Horas</label>
              <input
                type="number"
                name="time-amount-hours"
                id="time-amount-hours"
                placeholder="HH"
                required
                min="0"
              />
              <div class="error-message"></div>
            </div>
            <div class="form-input">
              <label for="time-amount-minutes">Minutos</label>
              <input
                type="number"
                name="time-amount-minutes"
                id="time-amount-minutes"
                placeholder="MM"
                required
                min="0"
              />
              <div class="error-message"></div>
            </div>
            <div class="form-input">
              <label for="time-amount-seconds">Segundos</label>
              <input
                type="number"
                name="time-amount-seconds"
                id="time-amount-seconds"
                placeholder="SS"
                required
                min="0"
              />
              <div class="error-message"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-input">
              <button type="submit">Calcular Costo</button>
            </div>
          </div>
        </form>
        <div class="calculation-results-container">
          <p>00.00</p>
          <p>LPS</p>
        </div>
      </div>
    </main>
  </body>
</html>
